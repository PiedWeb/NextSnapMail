name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Payload, syntax and reproducible theme
        run: python3 tools/verify.py
      - name: Temporary maintenance helper syntax
        run: |
          for file in tools/web-runtime-maintenance/*.php; do php -l "$file"; done
      - name: Read-only update diagnostics
        run: python3 -m unittest discover -s tests -p 'test_*.py'
