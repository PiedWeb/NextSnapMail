  window.fixtureErrors=[];
  addEventListener('error',event=>fixtureErrors.push(event.message));

<script src="/.local-work/pied-web-ux/interface-comfort.js"></script>
<script>
  const compact=document.querySelector('#compact');
  compact.onchange=()=>document.documentElement.classList.toggle('pw-compact',compact.checked);
  window.fixtureFlags=['client','Important','$pwremind-txyz1','$PWSENDING','$pwcustom','$pwremind-not-a-stamp'];
  window.fixtureFolders=[{fullName:'INBOX.Reminders',delimiter:'.'},{fullName:'INBOX.Scheduled',delimiter:'.'},{fullName:'Projects.Scheduled',delimiter:'.'}];
  window.fixtureReady=(async()=>{
    const source=await (await fetch('/app/snappymail/v/2.38.2/static/js/app.js')).text();
    // Exercise the native predicate rather than duplicating its hidden-keyword
    // rule; the only dependency here is the pre-existing native exclusion list.
    const predicateStart=source.indexOf('isAllowedKeyword = value =>');
    const predicateEnd=source.indexOf('FolderUserStore =',predicateStart);
    const predicate=source.slice(predicateStart,predicateEnd).trim().replace(/,$/,'');
    window.nativeKeywordAllowed=Function('ignoredKeywords', 'let '+predicate+';return isAllowedKeyword;')([]);
    window.renderFixtureLabels=async(lang='fr')=>{
      document.documentElement.lang=lang;
      const data=await (await fetch('/app/bundled-plugins/nextcloud/langs/'+lang+'.json')).json();
      document.querySelector('#attach-files').textContent=data.NEXTCLOUD.ATTACH_FILES;
      document.querySelector('#save-eml').textContent=data.NEXTCLOUD.SAVE_EML;
      document.querySelector('#folder-labels').replaceChildren(...fixtureFolders.map(folder=>{
        const node=document.createElement('li');node.textContent=rl.mailUi.folderLabel(folder,folder.fullName.split('.').pop(),'INBOX.Drafts');return node;
      }));
      const tags=fixtureFlags.filter(nativeKeywordAllowed);
      document.querySelector('#tag-options').replaceChildren(...tags.map(tag=>new Option(tag,tag)));
      document.querySelector('#reader-tags').textContent=tags.join(', ');
    };
    await renderFixtureLabels();
    const vmDom=document.querySelector('#fixture-popup');
    let visible=false,notify;
    const modalVisible=value=>value===undefined ? visible : (visible=!!value,notify?.(visible));
    modalVisible.subscribe=callback=>{notify=callback;};
    window.fixtureModalEvents=[];
    const stamp=type=>fixtureModalEvents.push({type,time:performance.now()});
    const vm={modalVisible,keyScope:{set(){},unset(){}},afterShow:()=>stamp('shown'),onHide:()=>stamp('hiding'),afterHide:()=>stamp('hidden')};
    const start=source.indexOf('// show/hide popup/modal');
    const marker="vmDom.addEventListener('transitionend', endShowHide);";
    const end=source.indexOf(marker,start)+marker.length;
    if(start<0||end<marker.length)throw Error('Native popup lifecycle contract not found');
    Function('vm','vmDom','visiblePopups','i18nToNodes','arePopupsVisible','autofocus','fireEvent',source.slice(start,end))(
      vm,vmDom,new Set,()=>{},()=>{},node=>node.querySelector('[autofocus]')?.focus(),()=>{});
    window.fixtureModal=vm;
    document.querySelector('#open-popup').onclick=()=>vm.modalVisible(true);
    document.querySelector('#close-popup').onclick=()=>vm.modalVisible(false);
    window.fixtureNativeMotionFallback=source.slice(start,end).includes('setTimeout');
    return true;
  })();
</script>
