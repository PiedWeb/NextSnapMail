<h1>Lecture de la liste, proposition 1.7.14</h1>
<p>Le point jaune ou gris à gauche change l’état lu, sans ouvrir le message. L’étoile non activée se révèle au survol ou au focus. Les pièces jointes occupent une colonne fixe à droite.</p>
